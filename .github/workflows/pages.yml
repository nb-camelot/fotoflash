name: Pages

# Pubblica la versione web (PWA, cartella web/) su GitHub Pages: https://nb-camelot.github.io/fotoflash/
# Gira DOPO «Bump version» riuscito su main (cioè a ogni rilascio, con la versione già aggiornata in
# gradle.properties: il commit di versione, pushato con il GITHUB_TOKEN, non avvierebbe un push) e a mano.
#   build:  test di web/, icone PNG con rsvg-convert, scripts/build-web.mjs (versione da
#           gradle.properties + sha corto, nome della cache del SW, verifica di manifest e precache);
#   deploy: pubblica l'artifact sull'ambiente github-pages.
# Configurazione una tantum (README, "Versione web (PWA)"): Settings → Pages → Source "GitHub Actions"
# e, nell'ambiente github-pages, main tra i branch che possono pubblicare.
on:
  workflow_run:
    workflows: ["Bump version"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta; quello in corso non si interrompe a metà (raccomandazione di GitHub per Pages).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build della PWA
    # Solo main: con "Run workflow" su dev (il branch di default, ammesso dall'ambiente github-pages)
    # si pubblicherebbe sul sito il codice non ancora rilasciato.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Dopo il bump: la punta di main contiene il commit di versione.
          ref: main

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      # Glob espanso dalla shell: funziona con ogni versione di Node (da Node 21 una cartella
      # passata a --test non viene più esplorata).
      - name: Test della versione web
        run: node --test web/tests/*.test.mjs

      - name: rsvg-convert per le icone PNG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          rsvg-convert --version

      # GITHUB_SHA aggiunge lo sha corto alla versione: ogni deploy ha un SW diverso e l'app si aggiorna.
      - name: Build del sito
        run: node scripts/build-web.mjs dist

      - name: Configura Pages
        uses: actions/configure-pages@v6

      - name: Artifact di Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy su GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
